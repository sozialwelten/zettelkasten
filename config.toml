# Konfiguration des Zettelkasten-Werkzeugs

[pfade]
exporte = "/mnt/daten/mastodon"          # <konto>/<datum>/<archiv>.zip
daten = "/mnt/daten/zettelkasten"        # Zwischenstände, Abschriften, Probe
vault = "/home/apollon/Nextcloud/Wolkenstadt/Dokumente/Arbeitsorganisation/Zettelkasten"

# Bereich je thematischem Konto (Benutzername ohne @). Zettel aus anderen Konten ordnet das Modell zu.
[bereiche]
hotelfachwesen = "Hauptbuch"
analytics = "Analytics"
soziologie = "Soziologie"
verein = "Verein"
waldbau = "Waldbau"
oikos = "Oikos"

[ollama]
adresse = "http://localhost:11434"
modell = "qwen3:32b"
bildmodell = "bild30"                    # qwen3-vl:30b ohne Nachdenken

[abschrift]
kante = 1500                             # Bilder vorher auf diese Kantenlänge verkleinern
reihenfolge = ["Soziologie", "Analytics", "Verein", "Waldbau", "Hauptbuch", "offen", "Oikos", "Gespräch", "Gespräch/Direkt"]
temperatur_pause = 83
temperatur_weiter = 70

[anreicherung]
kopfzeile_ab = 25                        # Zeilen, die in so vielen Abschriften gleich vorkommen, sieht das Modell nicht

# Bereiche für Zettel aus @sozialwelten, mit der Beschreibung, die das Modell bekommt
[anreicherung.bereiche]
Hauptbuch = "Buchhaltung, Bilanzbuchhaltung, DATEV, Steuern, Kaufmännisches, Hotellerie, Beruf und Berufsausbildung; Rechtsfragen der Berufspraxis wie Arbeitsvertragsrecht, Handelsrecht, HGB und Steuerrecht; Wirtschaft, Märkte und Finanzen, auch aus Zeitungsnotizen"
Analytics = "Programmierung, KI, SQL, Python, Data Analytics, quantitative Sozialwissenschaft; Linux, Server, Selbsthosting, Werkzeuge und Technik, Podcast-Technik, Amateurfunk"
Soziologie = "Soziologie und Gesellschaftstheorie im akademischen Sinn, etwa Systemtheorie, Luhmann, Baecker, Mauss, Gabe, Kommunikation; Kommunikation zwischen Unbekannten (KzU), Trialog, Bedingungen und Ermöglichungsbedingungen; Studium der Sozialökonomie; das Fediverse als Forschungsgegenstand; Zeitdiagnose zu Politik und Gesellschaft, auch aus Zeitungsnotizen"
Verein = "Vereinswesen und Vereinsrecht, Anoxinon, c-base, CCC, Demos, Ehrenamt, Betrieb von Fediverse-Instanzen für Vereine und Gruppen; Engagement vor Ort wie Fedi-Stammtisch, Glocal, Köln-Kalk"
Waldbau = "Jagd, Jagdschein, Waffenkunde, Natur, Bäume, Pilze, Kräuter"
Oikos = "Persönliches, Termine, Wohnen, Ausflüge, Konsum, Freizeit, Reisen, persönliche Reflexion und Planung"
Recht = "juristische Grundlagen aus dem Jurastudium: Zivilrecht, Römische Rechtsgeschichte, Öffentliches Recht und Grundrechte, Strafrecht, Rechtsphilosophie, Rechtsgeschichte"
ungeordnet = "passt in keinen der anderen Bereiche sicher"
